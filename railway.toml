[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
# Watch patterns are intentionally omitted so any uploaded source change
# triggers a Railway build.

[deploy]
healthcheckPath = "/meta/health/readyz"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Re-encrypt the dashboard's OAuth client_secret with this instance's
# CryptoGen site key on every deploy. Idempotent UPSERT against
# oauth_clients keyed by DASHBOARD_OIDC_CLIENT_ID. Without it, a rotated
# DASHBOARD_OIDC_CLIENT_SECRET in Railway env vars no longer matches the
# encrypted blob in the DB and the dashboard handoff dies with
# `invalid_client` / "Decryption failed HMAC authentication" on /token.
# `|| true` keeps a transient one-deploy failure from blocking Apache; the
# next deploy will retry, and operators can run the same script manually.
preDeployCommand = "echo PREDEPLOY_OK; php /var/www/localhost/htdocs/openemr/bin/ensure_dashboard_oauth_client.php 2>&1 || echo PREDEPLOY_PHP_FAILED; echo PREDEPLOY_DONE"
