<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <text x="700" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">
    Agent Orchestration — AgentLlmOrchestrator::buildVerifiedAnswer()
  </text>
  <text x="700" y="74" text-anchor="middle" font-size="13" fill="#475569">
    Five layers — caller, provider gate, LLM round-trip, verify and fallback, anonymized logging.
  </text>

  <!-- 1 Caller -->
  <rect x="60" y="110" width="1280" height="135" rx="10" ry="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="138" font-size="15" font-weight="bold" fill="#0f172a">1. Caller / Inputs</text>
  <text x="80" y="162" font-size="12" fill="#0f172a">AgentIntentRestController → buildVerifiedAnswer($intent, $accessToken, $packet, $deterministicAnswer)</text>
  <text x="80" y="184" font-size="12" fill="#0f172a">intent: AgentIntentCatalog entry (intent_id, button_label, prompt template, caps)</text>
  <text x="80" y="202" font-size="12" fill="#0f172a">accessToken: AgentAccessBroker → AgentAccessToken (patient binding + permitted tools)</text>
  <text x="80" y="220" font-size="12" fill="#0f172a">packet: AgentEvidenceResponseBuilder + AgentEvidenceToolset (sources[], tool_runs[])</text>
  <text x="80" y="238" font-size="12" fill="#0f172a">deterministicAnswer: non-LLM fallback that the verifier must also approve</text>

  <!-- 2 Provider Gate -->
  <rect x="60" y="265" width="620" height="190" rx="10" ry="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="293" font-size="15" font-weight="bold" fill="#0f172a">2. Provider Gate</text>
  <text x="80" y="318" font-size="12" fill="#0f172a">AgentLlmProviderFactory::create()</text>
  <text x="80" y="336" font-size="12" fill="#0f172a">  → OpenAiResponsesAgentLlmProvider | DisabledAgentLlmProvider</text>
  <text x="80" y="356" font-size="12" fill="#0f172a">AgentLlmConfig::fromEnvironment() — strips UTF-8 BOM, validates key &amp; model</text>
  <text x="80" y="374" font-size="12" fill="#0f172a">AgentLlmProviderInterface::isConfigured() — the gate</text>
  <text x="80" y="392" font-size="12" fill="#0f172a">getConfigurationIssue() → 'missing_api_key' | 'missing_model' | 'provider_disabled'</text>
  <text x="80" y="416" font-size="12" fill="#334155">baseLlmMetadata() seeds llm metadata (provider, model, fallback_reason, usage)</text>

  <!-- 3 LLM Round-Trip -->
  <rect x="720" y="265" width="620" height="190" rx="10" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="293" font-size="15" font-weight="bold" fill="#0f172a">3. LLM Round-Trip</text>
  <text x="740" y="318" font-size="12" fill="#0f172a">new AgentLlmRequest(intent, evidencePacket, AgentAnswerSchema::jsonSchema())</text>
  <text x="740" y="336" font-size="12" fill="#0f172a">logLlmRequest() — anonymized 'agent.llm.started' + readable request block</text>
  <text x="740" y="354" font-size="12" fill="#0f172a">provider->complete($request) → AgentLlmResponse (answer + usage metadata)</text>
  <text x="740" y="372" font-size="12" fill="#0f172a">AgentAnswerSchema::normalize($answer)</text>
  <text x="740" y="390" font-size="12" fill="#0f172a">  → answer_blocks[].claims[] + missing_or_uncertain[]</text>
  <text x="740" y="416" font-size="12" fill="#334155">catch (Throwable) → 'agent.llm.failed' (error_class), fallback_reason='provider_error'</text>

  <!-- 4 Verify & Fallback -->
  <rect x="60" y="475" width="1280" height="170" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="80" y="503" font-size="15" font-weight="bold" fill="#0f172a">4. Verify &amp; Fallback</text>
  <text x="80" y="528" font-size="12" fill="#0f172a">AgentAnswerVerifier::verify($answer, $accessToken, $packet)</text>
  <text x="80" y="548" font-size="12" fill="#0f172a">  passed → verifiedResponse('llm_structured_verified', …)</text>
  <text x="80" y="566" font-size="12" fill="#0f172a">  failed → logVerificationFailure() + retry verifier on $deterministicAnswer</text>
  <text x="80" y="584" font-size="12" fill="#0f172a">     passed → 'deterministic_verified_fallback' (or 'deterministic_verified' when provider unconfigured)</text>
  <text x="80" y="602" font-size="12" fill="#0f172a">     failed → systemRefusal() → 'verified_refusal' (system_refusal warning)</text>
  <text x="80" y="624" font-size="12" fill="#334155">All exits go through verifiedResponse(): { status, response_generation, answer, verification, llm }</text>

  <!-- 5 Anonymized Logging -->
  <rect x="60" y="675" width="1280" height="170" rx="10" ry="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="80" y="703" font-size="15" font-weight="bold" fill="#0f172a">5. Anonymized Logging</text>
  <text x="80" y="725" font-size="12" fill="#0f172a">Anonymizer::anonymizePayload($accessToken, $payload) wraps every log emission</text>
  <text x="80" y="745" font-size="12" fill="#0f172a">anonymizedLlmRequest() — splits instructions, decodes JSON input, scrubs identifiers</text>
  <text x="80" y="763" font-size="12" fill="#0f172a">anonymizedLlmResponse() — scrubs structured answer before it lands in 'agent.llm.finished'</text>
  <text x="80" y="783" font-size="12" fill="#0f172a">Failure: 'redaction_status: failed' + redaction_error_class — raw text never leaks</text>
  <text x="80" y="809" font-size="12" fill="#334155">Events: agent.llm.started · agent.llm.finished · agent.llm.failed · agent.verification.failed · agent.verification.deterministic_fallback_failed</text>

  <!-- Edges -->
  <line x1="370" y1="245" x2="370" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="360" x2="720" y2="360" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="690" y="350" font-size="11" fill="#0f172a">isConfigured = true</text>

  <line x1="370" y1="455" x2="370" y2="475" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <text x="380" y="470" font-size="11" fill="#0f172a">isConfigured = false → deterministic path</text>

  <line x1="1030" y1="455" x2="1030" y2="475" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="470" font-size="11" fill="#0f172a">normalized answer</text>

  <line x1="1030" y1="645" x2="1030" y2="675" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="1040" y="666" font-size="11" fill="#0f172a">agent.verification.* events</text>

  <line x1="370" y1="645" x2="370" y2="675" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="380" y="666" font-size="11" fill="#0f172a">verifier outcome</text>

  <!-- LLM logging edge from L3 to L5 (curved around L4) -->
  <path d="M 1330 360 C 1380 360 1380 760 1340 760" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="1300" y="558" font-size="11" fill="#0f172a">agent.llm.* events</text>
</svg>
