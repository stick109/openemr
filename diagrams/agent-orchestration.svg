<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <text x="740" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">
    Agent Orchestration — AgentLlmOrchestrator::buildVerifiedAnswer()
  </text>
  <text x="740" y="84" text-anchor="middle" font-size="16" fill="#475569">
    Five layers — caller, provider gate, LLM round-trip, verify and fallback, anonymized logging.
  </text>

  <!-- 1 Caller / Inputs -->
  <rect x="60" y="120" width="1360" height="170" rx="10" ry="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="156" font-size="20" font-weight="bold" fill="#0f172a">1. Caller / Inputs</text>
  <text x="80" y="186" font-size="15" fill="#0f172a">AgentIntentRestController → buildVerifiedAnswer($intent, $accessToken, $packet, $deterministicAnswer)</text>
  <text x="80" y="212" font-size="15" fill="#0f172a">intent: AgentIntentCatalog entry (intent_id, button_label, prompt template, caps)</text>
  <text x="80" y="236" font-size="15" fill="#0f172a">accessToken: AgentAccessBroker → AgentAccessToken (patient binding + permitted tools)</text>
  <text x="80" y="260" font-size="15" fill="#0f172a">packet: AgentEvidenceResponseBuilder + AgentEvidenceToolset (sources[], tool_runs[])</text>
  <text x="80" y="282" font-size="15" fill="#0f172a">deterministicAnswer: non-LLM fallback that the verifier must also approve</text>

  <!-- 2 Provider Gate -->
  <rect x="60" y="310" width="660" height="240" rx="10" ry="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="346" font-size="20" font-weight="bold" fill="#0f172a">2. Provider Gate</text>
  <text x="80" y="376" font-size="15" fill="#0f172a">AgentLlmProviderFactory::create()</text>
  <text x="80" y="400" font-size="15" fill="#0f172a">  → OpenAiResponsesAgentLlmProvider | DisabledAgentLlmProvider</text>
  <text x="80" y="424" font-size="15" fill="#0f172a">AgentLlmConfig::fromEnvironment() — strips UTF-8 BOM, validates key &amp; model</text>
  <text x="80" y="448" font-size="15" fill="#0f172a">AgentLlmProviderInterface::isConfigured() — the gate</text>
  <text x="80" y="472" font-size="15" fill="#0f172a">getConfigurationIssue() →</text>
  <text x="80" y="496" font-size="15" fill="#0f172a">  'missing_api_key' | 'missing_model' | 'provider_disabled'</text>
  <text x="80" y="528" font-size="14" fill="#334155">baseLlmMetadata() seeds llm metadata (provider, model, fallback_reason, usage)</text>

  <!-- 3 LLM Round-Trip -->
  <rect x="760" y="310" width="660" height="240" rx="10" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="780" y="346" font-size="20" font-weight="bold" fill="#0f172a">3. LLM Round-Trip</text>
  <text x="780" y="376" font-size="15" fill="#0f172a">new AgentLlmRequest(intent, evidencePacket,</text>
  <text x="780" y="400" font-size="15" fill="#0f172a">  AgentAnswerSchema::jsonSchema())</text>
  <text x="780" y="424" font-size="15" fill="#0f172a">logLlmRequest() — anonymized 'agent.llm.started'</text>
  <text x="780" y="448" font-size="15" fill="#0f172a">provider->complete($request) → AgentLlmResponse</text>
  <text x="780" y="472" font-size="15" fill="#0f172a">AgentAnswerSchema::normalize($answer) →</text>
  <text x="780" y="496" font-size="15" fill="#0f172a">  answer_blocks[].claims[] + missing_or_uncertain[]</text>
  <text x="780" y="528" font-size="14" fill="#334155">catch (Throwable) → 'agent.llm.failed', fallback_reason='provider_error'</text>

  <!-- 4 Verify & Fallback -->
  <rect x="60" y="570" width="1360" height="220" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="80" y="606" font-size="20" font-weight="bold" fill="#0f172a">4. Verify &amp; Fallback</text>
  <text x="80" y="636" font-size="15" fill="#0f172a">AgentAnswerVerifier::verify($answer, $accessToken, $packet)</text>
  <text x="80" y="660" font-size="15" fill="#0f172a">  passed → verifiedResponse('llm_structured_verified', …)</text>
  <text x="80" y="684" font-size="15" fill="#0f172a">  failed → logVerificationFailure() + retry verifier on $deterministicAnswer</text>
  <text x="80" y="708" font-size="15" fill="#0f172a">     passed → 'deterministic_verified_fallback' (or 'deterministic_verified' when provider unconfigured)</text>
  <text x="80" y="732" font-size="15" fill="#0f172a">     failed → systemRefusal() → 'verified_refusal' (system_refusal warning)</text>
  <text x="80" y="764" font-size="14" fill="#334155">All exits go through verifiedResponse(): { status, response_generation, answer, verification, llm }</text>

  <!-- 5 Anonymized Logging -->
  <rect x="60" y="810" width="1360" height="220" rx="10" ry="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="80" y="846" font-size="20" font-weight="bold" fill="#0f172a">5. Anonymized Logging</text>
  <text x="80" y="876" font-size="15" fill="#0f172a">Anonymizer::anonymizePayload($accessToken, $payload) wraps every log emission</text>
  <text x="80" y="900" font-size="15" fill="#0f172a">anonymizedLlmRequest() — splits instructions, decodes JSON input, scrubs identifiers</text>
  <text x="80" y="924" font-size="15" fill="#0f172a">anonymizedLlmResponse() — scrubs structured answer before it lands in 'agent.llm.finished'</text>
  <text x="80" y="948" font-size="15" fill="#0f172a">Failure: 'redaction_status: failed' + redaction_error_class — raw text never leaks</text>
  <text x="80" y="980" font-size="14" fill="#334155">Events: agent.llm.started · agent.llm.finished · agent.llm.failed</text>
  <text x="80" y="1002" font-size="14" fill="#334155">       · agent.verification.failed · agent.verification.deterministic_fallback_failed</text>

  <!-- Edges -->
  <line x1="390" y1="290" x2="390" y2="310" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="720" y1="430" x2="760" y2="430" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="725" y="420" font-size="14" fill="#0f172a">isConfigured = true</text>

  <line x1="390" y1="550" x2="390" y2="570" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <text x="400" y="565" font-size="14" fill="#0f172a">isConfigured = false → deterministic path</text>

  <line x1="1090" y1="550" x2="1090" y2="570" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1100" y="565" font-size="14" fill="#0f172a">normalized answer</text>

  <line x1="1090" y1="790" x2="1090" y2="810" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="1100" y="805" font-size="14" fill="#0f172a">agent.verification.* events</text>

  <line x1="390" y1="790" x2="390" y2="810" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="400" y="805" font-size="14" fill="#0f172a">verifier outcome</text>

  <!-- LLM logging edge from L3 to L5 (curved around L4) -->
  <path d="M 1410 430 C 1465 430 1465 920 1420 920" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="1420" y="680" font-size="14" fill="#0f172a" transform="rotate(-90 1420 680)">agent.llm.* events</text>
</svg>
