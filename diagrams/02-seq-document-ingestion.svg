  <rect width="1480" height="1320" fill="white"/>
  <rect x="80.0" y="1080.0" width="1380.0" height="170.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="88.0" y="1133.5" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">Notes</text>
  <text x="88.0" y="1150.9" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• trace_id is generated PHP-side and echoed everywhere → click-to-source can resolve overlays after navigation.</text>
  <text x="88.0" y="1168.3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• If extraction fails (schema-invalid / low-confidence), the supervisor returns a safe-refusal — no DB writes.</text>
  <text x="88.0" y="1185.7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• Each step emits an OTel span; PHI redactor strips raw text before export.</text>
  <text x="88.0" y="1203.1" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• PDF bytes are written once and referenced by path; nothing copies the binary into the trace.</text>
