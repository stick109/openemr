<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1400" viewBox="0 0 1480 1400">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1480" height="1400" fill="white"/>

  <!-- Title -->
  <text x="740" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">OpenAI API Call Sequence — Extractor Worker during Document Ingestion</text>

  <!-- Lifeline: Supervisor -->
  <rect x="60" y="70" width="160" height="70" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Supervisor</text>
  <text x="140" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">(LangGraph node)</text>
  <line x1="140" y1="140" x2="140" y2="1340" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Lifeline: Extractor -->
  <rect x="290" y="70" width="180" height="70" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Extractor Worker</text>
  <text x="380" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">(LangGraph node)</text>
  <line x1="380" y1="140" x2="380" y2="1340" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Lifeline: Files API -->
  <rect x="540" y="70" width="160" height="70" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="620" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0f172a">OpenAI Files API</text>
  <text x="620" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">(file upload)</text>
  <line x1="620" y1="140" x2="620" y2="1340" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Lifeline: Chat API -->
  <rect x="770" y="70" width="200" height="70" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="870" y="95" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0f172a">OpenAI Chat API</text>
  <text x="870" y="113" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">gpt-4o-mini · Structured Outputs</text>
  <line x1="870" y1="140" x2="870" y2="1340" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Lifeline: Pydantic -->
  <rect x="1040" y="70" width="160" height="70" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1120" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Pydantic v2</text>
  <text x="1120" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">Schema Validator</text>
  <line x1="1120" y1="140" x2="1120" y2="1340" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Lifeline: Bbox Verifier -->
  <rect x="1270" y="70" width="160" height="70" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1350" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Bbox Verifier</text>
  <text x="1350" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">(page-crop check)</text>
  <line x1="1350" y1="140" x2="1350" y2="1340" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- 1. Supervisor → Extractor: route(extract) -->
  <line x1="140" y1="200" x2="380" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="260" y="193" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">1. route(next_node="extract")</text>

  <!-- 2. Extractor → Files API: upload PDF -->
  <line x1="380" y1="260" x2="620" y2="260" stroke="#e11d48" stroke-width="2" marker-end="url(#ar)"/>
  <text x="500" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#e11d48">2. files.create(file=pdf_bytes, purpose="assistants")</text>

  <!-- 3. Files API → Extractor: file_id -->
  <line x1="620" y1="310" x2="380" y2="310" stroke="#e11d48" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="500" y="303" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#e11d48">3. {file_id: "file-abc123"}</text>

  <!-- 4. Extractor → Chat API: Structured Outputs call -->
  <line x1="380" y1="380" x2="870" y2="380" stroke="#e11d48" stroke-width="2" marker-end="url(#ar)"/>
  <text x="625" y="365" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#e11d48">4. chat.completions.create(model="gpt-4o-mini",</text>
  <text x="625" y="378" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#e11d48">response_format={type:"json_schema", schema: LabPdf|IntakeForm}, file_id)</text>

  <!-- Note: Structured Outputs -->
  <rect x="960" y="350" width="280" height="65" rx="4" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="975" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#713f12">Structured Outputs enforces strict JSON —</text>
  <text x="975" y="384" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#713f12">the API guarantees the shape matches the</text>
  <text x="975" y="398" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#713f12">Pydantic model or returns a refusal.</text>

  <!-- 5. Chat API → Extractor: strict JSON -->
  <line x1="870" y1="460" x2="380" y2="460" stroke="#e11d48" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="625" y="447" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#e11d48">5. {choices: [{message: {content: ‹strict JSON›}}],</text>
  <text x="625" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#e11d48">usage: {prompt_tokens, completion_tokens}}</text>

  <!-- 6. Extractor → Pydantic: validate -->
  <line x1="380" y1="530" x2="1120" y2="530" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
  <text x="750" y="523" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7c3aed">6. LabPdf.model_validate(json) or IntakeForm.model_validate(json)</text>

  <!-- ALT box -->
  <rect x="250" y="580" width="1200" height="470" rx="0" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="598" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#475569">alt</text>
  <text x="310" y="598" font-family="Arial,Helvetica,sans-serif" font-size="11" font-style="italic" fill="#16a34a">[schema_valid = true &amp;&amp; extraction_confidence ≥ threshold]</text>

  <!-- 7a. Pydantic → Extractor: validated model (happy path) -->
  <line x1="1120" y1="640" x2="380" y2="640" stroke="#16a34a" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="750" y="633" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">7a. Validated LabPdf / IntakeForm (every leaf has source_citation: Citation)</text>

  <!-- 8a. Extractor → BboxVerifier: verify -->
  <line x1="380" y1="700" x2="1350" y2="700" stroke="#c2410c" stroke-width="2" marker-end="url(#ao)"/>
  <text x="865" y="693" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2410c">8a. verify_bboxes(citations, pdf_pages) — bbox ⊂ page, area &gt; 0, crop contains quote</text>

  <!-- 9a. BboxVerifier → Extractor: OK -->
  <line x1="1350" y1="750" x2="380" y2="750" stroke="#16a34a" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="865" y="743" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">9a. ✓ all bboxes valid</text>

  <!-- 10a. Extractor → Supervisor: return result -->
  <line x1="380" y1="810" x2="140" y2="810" stroke="#16a34a" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="260" y="803" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">10a. return ExtractionResult(payload, citations, tokens)</text>

  <!-- Divider line -->
  <line x1="250" y1="860" x2="1450" y2="860" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="310" y="880" font-family="Arial,Helvetica,sans-serif" font-size="11" font-style="italic" fill="#dc2626">[schema mismatch OR confidence &lt; threshold — retry once]</text>

  <!-- 7b. Pydantic → Extractor: ValidationError -->
  <line x1="1120" y1="920" x2="380" y2="920" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="750" y="913" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#dc2626">7b. raise ValidationError(errors=[...])</text>

  <!-- 8b. Extractor → Chat API: retry with stricter prompt -->
  <line x1="380" y1="980" x2="870" y2="980" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="625" y="966" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#dc2626">8b. chat.completions.create(…, messages=[…original,</text>
  <text x="625" y="980" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#dc2626">{role:"user", content: validator_errors_str}]) — RETRY with stricter prompt</text>

  <!-- 9b. Chat API → Extractor: corrected JSON -->
  <line x1="870" y1="1030" x2="380" y2="1030" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="625" y="1023" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#dc2626">9b. {choices: [{message: {content: ‹corrected JSON›}}]}</text>

  <!-- Note: retry failure -->
  <rect x="960" y="990" width="280" height="65" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="975" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991b1b">If retry also fails Pydantic validation,</text>
  <text x="975" y="1024" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991b1b">Extractor raises ErrorEvent → Supervisor</text>
  <text x="975" y="1038" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991b1b">routes to "refuse". No DB writes. safe_refusal = pass.</text>

  <!-- 11. OTel span recording -->
  <line x1="380" y1="1120" x2="420" y2="1120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="420" y1="1120" x2="420" y2="1150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="420" y1="1150" x2="380" y2="1150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="430" y="1133" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6b7280">11. Record OTel span: extractor.run</text>
  <text x="430" y="1147" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6b7280">{latency_ms, tokens_in, tokens_out, cost_usd}</text>

  <!-- 12. Return to Supervisor -->
  <line x1="380" y1="1200" x2="140" y2="1200" stroke="#16a34a" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="260" y="1186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">12. state.tool_sequence.append("extractor.run")</text>
  <text x="260" y="1200" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#16a34a">Supervisor decides next: retrieve | finalize | refuse</text>

  <!-- Legend -->
  <rect x="40" y="1300" width="700" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="55" y="1320" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Legend</text>
  <line x1="55" y1="1338" x2="85" y2="1338" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="1342" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">LangGraph internal</text>
  <line x1="200" y1="1338" x2="230" y2="1338" stroke="#e11d48" stroke-width="2"/>
  <text x="235" y="1342" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">OpenAI external API</text>
  <line x1="355" y1="1338" x2="385" y2="1338" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="1342" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Pydantic validation</text>
  <line x1="505" y1="1338" x2="535" y2="1338" stroke="#c2410c" stroke-width="2"/>
  <text x="540" y="1342" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Bbox verification</text>
  <line x1="55" y1="1362" x2="85" y2="1362" stroke="#475569" stroke-width="2"/>
  <text x="90" y="1366" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Solid = sync call</text>
  <line x1="200" y1="1362" x2="230" y2="1362" stroke="#475569" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="235" y="1366" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Dashed = return</text>
  <line x1="355" y1="1362" x2="385" y2="1362" stroke="#dc2626" stroke-width="2"/>
  <text x="390" y="1366" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Red = error / retry path</text>
</svg>
