  <rect x="60.0" y="380.0" width="1380.0" height="540.0" rx="6" fill="none" stroke="#16a34a" stroke-width="2.0" stroke-dasharray="8,4"/>
  <text x="68.0" y="400.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#166534">Query — runs per retriever invocation; deterministic for fixed corpus + query</text>
  <rect x="60.0" y="80.0" width="1380.0" height="280.0" rx="6" fill="none" stroke="#0284c7" stroke-width="2.0" stroke-dasharray="8,4"/>
