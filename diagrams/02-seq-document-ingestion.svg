  <text x="1240.0" y="114.6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">OpenAI</text>
  <text x="1240.0" y="132.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">(Files + chat)</text>
