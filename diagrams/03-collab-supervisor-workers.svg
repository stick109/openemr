<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000" viewBox="0 0 1480 1000">
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1480" height="1000" fill="white"/>
  <rect x="80.0" y="880.0" width="1380.0" height="100.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="88.0" y="898.5" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">Invariants</text>
  <text x="88.0" y="915.9" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• Only the supervisor changes the next-node decision; workers append to state but never branch.</text>
  <text x="88.0" y="933.3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• Workers must return either a complete typed payload or raise an ErrorEvent (no partial state).</text>
  <text x="88.0" y="950.7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• Hand-offs are spans named exactly after the node ('extractor.run', 'retriever.run'); the eval rubric</text>
  <text x="88.0" y="968.1" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">asserts the recorded sequence matches the expected one for each fixture.</text>
  <rect x="100.0" y="500.0" width="380.0" height="180.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="108.0" y="546.5" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Extractor worker</text>
  <text x="108.0" y="565.3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">OpenAI Files API + Structured Outputs</text>
  <text x="108.0" y="584.2" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• gpt-4o-mini · response_format=json_schema</text>
  <text x="108.0" y="603.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Pydantic v2 strict validation</text>
  <text x="108.0" y="621.9" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Returns extracted + per-field Citation (with bbox)</text>
  <text x="108.0" y="640.7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Re-tries once with stricter prompt on schema mismatch</text>
  <rect x="1000.0" y="500.0" width="380.0" height="180.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="1008.0" y="546.5" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Retriever worker</text>
  <text x="1008.0" y="565.3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Hybrid RAG — see diagram 04</text>
  <text x="1008.0" y="584.2" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Builds query from state (extracted abnormal labs / chief concern)</text>
  <text x="1008.0" y="603.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• BM25 + dense, RRF fuse, Cohere rerank</text>
  <text x="1008.0" y="621.9" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Returns top-5 GuidelineSnippet with Citation</text>
  <text x="1008.0" y="640.7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Falls back to cross-encoder if Cohere unavailable</text>
  <rect x="80.0" y="120.0" width="380.0" height="170.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="88.0" y="161.4" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">State (LangGraph TypedDict)</text>
  <text x="88.0" y="180.3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• file_path · doc_type · trace_id · patient_id · encounter_id</text>
  <text x="88.0" y="199.1" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• extracted: LabPdf | IntakeForm | None</text>
  <text x="88.0" y="218.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• evidence: list[GuidelineSnippet]</text>
  <text x="88.0" y="236.8" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• tool_sequence: list[str]</text>
  <text x="88.0" y="255.7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• errors: list[ErrorEvent]</text>
  <rect x="600.0" y="270.0" width="280.0" height="200.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="608.0" y="317.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Supervisor (T=0)</text>
  <text x="608.0" y="335.9" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Reads state. Decides ONE of:</text>
  <text x="608.0" y="354.7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• extract — if extracted is None</text>
  <text x="608.0" y="373.6" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• retrieve — if guideline question and evidence is empty</text>
  <text x="608.0" y="392.4" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• finalize — if state is sufficient</text>
  <text x="608.0" y="411.3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• refuse — if errors or low confidence</text>
  <text x="608.0" y="430.1" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Prompt + decision logged as 'supervisor.route' span</text>
  <text x="740.0" y="44.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Supervisor + 2-Worker Collaboration — deterministic routing, inspectable hand-offs</text>
  <rect x="80.0" y="720.0" width="420.0" height="120.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="290.0" y="765.9" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">Persists handoff log</text>
  <text x="290.0" y="783.3" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">tool_sequence accumulates after every node:</text>
  <text x="290.0" y="800.7" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">['supervisor.route', 'extractor.run', 'supervisor.route', 'retriever.run', 'supervisor.finalize']</text>
  <rect x="600.0" y="720.0" width="280.0" height="160.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="608.0" y="765.9" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Finalize</text>
  <text x="608.0" y="784.7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Compose ExtractionResult</text>
  <text x="608.0" y="803.6" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Compute cost_usd, latency_ms_per_step</text>
  <text x="608.0" y="822.4" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Emit encounter event (no PHI)</text>
  <text x="608.0" y="841.3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• END node returns to FastAPI</text>
  <text x="740.0" y="75.6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#475569">Each transition is a logged OTel span. The supervisor is T=0; its prompt is checked into source; its decisions are reproducible from state.</text>
  <rect x="1000.0" y="730.0" width="280.0" height="120.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="1008.0" y="765.3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Safe refusal</text>
  <text x="1008.0" y="784.1" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• Returns {status: refused, reason}</text>
  <text x="1008.0" y="803.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• No DB writes downstream</text>
  <text x="1008.0" y="821.8" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">• rubric: safe_refusal pass</text>
  <rect x="600.0" y="140.0" width="280.0" height="80.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="740.0" y="174.2" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">Entry — POST /api/agent/run</text>
  <text x="740.0" y="193.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">parses request → seeds state</text>
  <line x1="740.0" y1="180.0" x2="740.0" y2="370.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <line x1="740.0" y1="370.0" x2="290.0" y2="590.0" stroke="#16a34a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ag)"/>
  <text x="515.0" y="473.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">route: extract</text>
  <line x1="740.0" y1="370.0" x2="1190.0" y2="590.0" stroke="#16a34a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ag)"/>
  <text x="965.0" y="473.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">route: retrieve</text>
  <line x1="290.0" y1="590.0" x2="740.0" y2="370.0" stroke="#16a34a" stroke-width="2.0" stroke-dasharray="8,4" marker-end="url(#ag)"/>
  <text x="515.0" y="473.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">state += {extracted}</text>
  <line x1="1190.0" y1="590.0" x2="740.0" y2="370.0" stroke="#16a34a" stroke-width="2.0" stroke-dasharray="8,4" marker-end="url(#ag)"/>
  <text x="965.0" y="473.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">state += {evidence}</text>
  <line x1="740.0" y1="370.0" x2="740.0" y2="800.0" stroke="#0284c7" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ab)"/>
  <text x="740.0" y="578.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0284c7">route: finalize</text>
  <line x1="740.0" y1="370.0" x2="1140.0" y2="790.0" stroke="#e11d48" stroke-width="2.0" stroke-dasharray="8,4" marker-end="url(#ar)"/>
  <text x="940.0" y="573.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#e11d48">route: refuse</text>
  <line x1="270.0" y1="205.0" x2="740.0" y2="370.0" stroke="#d97706" stroke-width="2.0" stroke-dasharray="8,4" />
  <text x="505.0" y="280.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d97706">reads</text>
  <line x1="740.0" y1="370.0" x2="290.0" y2="780.0" stroke="#d97706" stroke-width="2.0" stroke-dasharray="8,4" />
  <text x="515.0" y="568.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d97706">appends</text>
</svg>