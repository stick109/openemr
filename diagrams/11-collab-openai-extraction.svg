<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1100" viewBox="0 0 1480 1100">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
  </defs>
  <rect width="1480" height="1100" fill="white"/>

  <!-- Title -->
  <text x="740" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">OpenAI Extraction Collaboration — Objects and Numbered Messages during Ingestion</text>

  <!-- ========== OBJECTS ========== -->

  <!-- save.php -->
  <rect x="40" y="160" width="180" height="100" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="130" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:save.php</text>
  <line x1="55" y1="195" x2="205" y2="195" stroke="#0284c7" stroke-width="0.5"/>
  <text x="130" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">CSRF + ACL gate</text>
  <text x="130" y="229" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Copy PDF → /var/uploads</text>
  <text x="130" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">POST to agent-service</text>

  <!-- Supervisor -->
  <rect x="40" y="440" width="180" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130" y="465" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:Supervisor</text>
  <line x1="55" y1="475" x2="205" y2="475" stroke="#16a34a" stroke-width="0.5"/>
  <text x="130" y="495" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">T=0, deterministic</text>
  <text x="130" y="509" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Routes: extract | retrieve</text>
  <text x="130" y="523" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">| finalize | refuse</text>

  <!-- Extractor -->
  <rect x="400" y="300" width="210" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="505" y="325" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:Extractor</text>
  <line x1="415" y1="335" x2="595" y2="335" stroke="#16a34a" stroke-width="0.5"/>
  <text x="505" y="355" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">LangGraph worker node</text>
  <text x="505" y="369" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Orchestrates OpenAI calls</text>
  <text x="505" y="383" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">+ validation pipeline</text>

  <!-- OpenAI Files API -->
  <rect x="770" y="110" width="180" height="85" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="860" y="135" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:OpenAI Files API</text>
  <line x1="785" y1="145" x2="935" y2="145" stroke="#e11d48" stroke-width="0.5"/>
  <text x="860" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">files.create()</text>
  <text x="860" y="179" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Upload PDF for vision</text>

  <!-- OpenAI Chat API -->
  <rect x="770" y="300" width="210" height="110" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="875" y="322" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:OpenAI Chat API</text>
  <text x="875" y="338" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9f1239">gpt-4o-mini</text>
  <line x1="785" y1="345" x2="965" y2="345" stroke="#e11d48" stroke-width="0.5"/>
  <text x="875" y="365" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Structured Outputs</text>
  <text x="875" y="379" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">response_format=json_schema</text>
  <text x="875" y="393" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Returns strict JSON</text>

  <!-- Pydantic Validator -->
  <rect x="770" y="510" width="210" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="875" y="535" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:PydanticValidator</text>
  <line x1="785" y1="545" x2="965" y2="545" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="875" y="565" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">LabPdf.model_validate()</text>
  <text x="875" y="579" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">IntakeForm.model_validate()</text>
  <text x="875" y="593" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Every leaf → Citation</text>

  <!-- Bbox Verifier -->
  <rect x="400" y="590" width="210" height="100" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="505" y="615" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:BboxVerifier</text>
  <line x1="415" y1="625" x2="595" y2="625" stroke="#c2410c" stroke-width="0.5"/>
  <text x="505" y="645" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">bbox ⊂ page, area &gt; 0</text>
  <text x="505" y="659" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">crop contains quote_or_value</text>
  <text x="505" y="673" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Reject field on failure</text>

  <!-- OTel Recorder -->
  <rect x="1100" y="300" width="180" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1190" y="325" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:OTelRecorder</text>
  <line x1="1115" y1="335" x2="1265" y2="335" stroke="#64748b" stroke-width="0.5"/>
  <text x="1190" y="355" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">extractor.run span</text>
  <text x="1190" y="369" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">tokens_in, tokens_out</text>
  <text x="1190" y="383" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">cost_usd, latency_ms</text>

  <!-- GraphState -->
  <rect x="130" y="700" width="210" height="110" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="235" y="725" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0f172a">:GraphState</text>
  <line x1="145" y1="735" x2="325" y2="735" stroke="#22c55e" stroke-width="0.5"/>
  <text x="235" y="755" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">patient_id, file_path</text>
  <text x="235" y="769" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">doc_type, trace_id</text>
  <text x="235" y="783" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">tool_sequence[]</text>
  <text x="235" y="797" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">extraction_result</text>

  <!-- ========== NUMBERED MESSAGES ========== -->

  <!-- 1: save.php → Supervisor -->
  <line x1="130" y1="260" x2="130" y2="440" stroke="#0284c7" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="12" y="330" width="236" height="36" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="130" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" fill="#0284c7">1: POST /api/agent/run</text>
  <text x="130" y="359" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#0284c7">{patient_id, file_path, doc_type, trace_id}</text>

  <!-- 2: Supervisor → Extractor -->
  <line x1="220" y1="480" x2="400" y2="370" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="250" y="405" width="180" height="18" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="340" y="418" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" fill="#16a34a">2: route(next_node="extract")</text>

  <!-- 3: Extractor → Files API -->
  <line x1="560" y1="300" x2="770" y2="185" stroke="#e11d48" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="590" y="225" width="200" height="18" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="690" y="238" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" fill="#e11d48">3: files.create(file=pdf_bytes)</text>

  <!-- 4: Files API → Extractor -->
  <line x1="770" y1="165" x2="580" y2="310" stroke="#e11d48" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="610" y="252" width="80" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="650" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#e11d48">4: {file_id}</text>

  <!-- 5: Extractor → Chat API -->
  <line x1="610" y1="350" x2="770" y2="350" stroke="#e11d48" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="618" y="328" width="144" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="690" y="340" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" fill="#e11d48">5: chat.completions.create()</text>

  <!-- 6: Chat API → Extractor -->
  <line x1="770" y1="380" x2="610" y2="380" stroke="#e11d48" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="630" y="368" width="120" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="690" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#e11d48">6: {strict JSON, usage}</text>

  <!-- 7: Extractor → Pydantic -->
  <line x1="590" y1="400" x2="770" y2="530" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
  <rect x="620" y="450" width="160" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="700" y="462" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">7: model_validate(json)</text>

  <!-- 8: Pydantic → Extractor -->
  <line x1="770" y1="560" x2="600" y2="400" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="620" y="475" width="180" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="710" y="487" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#7c3aed">8: Validated LabPdf (+ Citations)</text>

  <!-- 9: Extractor → BboxVerifier -->
  <line x1="480" y1="400" x2="480" y2="590" stroke="#c2410c" stroke-width="2" marker-end="url(#ao)"/>
  <rect x="368" y="490" width="195" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="465" y="502" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" fill="#c2410c">9: verify_bboxes(citations, pdf)</text>

  <!-- 10: BboxVerifier → Extractor -->
  <line x1="530" y1="590" x2="530" y2="400" stroke="#c2410c" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="535" y="500" width="60" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="565" y="512" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#c2410c">10: ✓ valid</text>

  <!-- 11: Extractor → OTel -->
  <line x1="610" y1="340" x2="1100" y2="340" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ay)"/>
  <rect x="790" y="310" width="200" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="890" y="322" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6b7280">11: record_span(tokens, cost, latency)</text>

  <!-- 12: Extractor → Supervisor (return) -->
  <line x1="400" y1="370" x2="220" y2="470" stroke="#16a34a" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="240" y="432" width="180" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="330" y="444" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#16a34a">12: return ExtractionResult</text>

  <!-- 13: Supervisor → State -->
  <line x1="130" y1="540" x2="200" y2="700" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#as)"/>
  <rect x="68" y="615" width="205" height="16" rx="3" fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="170" y="627" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#22c55e">13: tool_sequence.append("extractor.run")</text>

  <!-- ========== NOTES ========== -->

  <!-- Retry note -->
  <rect x="1080" y="520" width="290" height="105" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="1095" y="540" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Retry path (not shown):</text>
  <text x="1095" y="558" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991b1b">If step 7 raises ValidationError,</text>
  <text x="1095" y="572" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991b1b">Extractor retries step 5 once with the</text>
  <text x="1095" y="586" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991b1b">validator's errors appended to the prompt.</text>
  <text x="1095" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991b1b">Second failure → ErrorEvent →</text>
  <text x="1095" y="614" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991b1b">Supervisor routes to "refuse".</text>

  <!-- Mock boundary note -->
  <rect x="1080" y="130" width="290" height="80" rx="4" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="1095" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#713f12">CI / Eval boundary:</text>
  <text x="1095" y="168" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#713f12">In eval mode, steps 3–6 hit a mock</text>
  <text x="1095" y="182" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#713f12">OpenAI client returning recorded VLM</text>
  <text x="1095" y="196" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#713f12">output. Same code path — mock at boundary.</text>

  <!-- ========== LEGEND ========== -->
  <rect x="40" y="860" width="720" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="55" y="880" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Legend</text>
  <rect x="55" y="895" width="18" height="12" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="80" y="905" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">PHP boundary</text>
  <rect x="165" y="895" width="18" height="12" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="190" y="905" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">LangGraph</text>
  <rect x="260" y="895" width="18" height="12" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="285" y="905" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">OpenAI external</text>
  <rect x="380" y="895" width="18" height="12" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="405" y="905" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Pydantic</text>
  <rect x="465" y="895" width="18" height="12" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
  <text x="490" y="905" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Bbox</text>
  <rect x="530" y="895" width="18" height="12" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="555" y="905" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Observability</text>
  <line x1="55" y1="925" x2="85" y2="925" stroke="#475569" stroke-width="2"/>
  <text x="90" y="929" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Solid = sync call</text>
  <line x1="200" y1="925" x2="230" y2="925" stroke="#475569" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="235" y="929" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#475569">Dashed = return / async</text>
</svg>
