<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="700" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">
    Agent Verification — AgentAnswerVerifier::verify()
  </text>
  <text x="700" y="74" text-anchor="middle" font-size="13" fill="#475569">
    Five layers — inputs &amp; source map, schema checks, per-claim rules, patient/source integrity, missingness &amp; tool-failure disclosure.
  </text>

  <!-- 1 Inputs & Source Map -->
  <rect x="60" y="110" width="1280" height="125" rx="10" ry="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="138" font-size="15" font-weight="bold" fill="#0f172a">1. Inputs &amp; Source Map</text>
  <text x="80" y="162" font-size="12" fill="#0f172a">verify(array $answer, AgentAccessToken $accessToken, array $packet)</text>
  <text x="80" y="180" font-size="12" fill="#0f172a">sourceMap() ← $packet['sources'] indexed by source_id</text>
  <text x="80" y="198" font-size="12" fill="#0f172a">$packet['tool_runs'] held aside for verifyToolFailures()</text>
  <text x="80" y="216" font-size="12" fill="#0f172a">$accessToken-&gt;getPatientContext()-&gt;getPid() — single allowed patient ID. Accumulators: $errors, $warnings, $totalText</text>

  <!-- 2 Schema -->
  <rect x="60" y="255" width="1280" height="135" rx="10" ry="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="283" font-size="15" font-weight="bold" fill="#0f172a">2. Schema &amp; Shape Checks</text>
  <text x="80" y="307" font-size="12" fill="#0f172a">answer_blocks must be a list (array_is_list)</text>
  <text x="80" y="325" font-size="12" fill="#0f172a">each block must be an object; heading required</text>
  <text x="80" y="343" font-size="12" fill="#0f172a">each block.claims must be a list</text>
  <text x="80" y="361" font-size="12" fill="#0f172a">missing_or_uncertain must be a list</text>
  <text x="80" y="379" font-size="12" fill="#334155">strlen($totalText) ≤ MAX_TOTAL_TEXT_LENGTH (4000) — 90-second workflow cap</text>

  <!-- 3 verifyClaim -->
  <rect x="60" y="410" width="620" height="200" rx="10" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="438" font-size="15" font-weight="bold" fill="#0f172a">3. verifyClaim() per claim</text>
  <text x="80" y="462" font-size="12" fill="#0f172a">text required</text>
  <text x="80" y="480" font-size="12" fill="#0f172a">containsOutOfScopeAdvice():</text>
  <text x="80" y="498" font-size="11" fill="#334155">/should|recommend|consider|start|stop|increase|decrease|prescribe|diagnose|treat|bill|order/</text>
  <text x="80" y="520" font-size="12" fill="#0f172a">empty citation_ids → certainty must be in UNCITED_CERTAINTIES</text>
  <text x="80" y="538" font-size="11" fill="#334155">['not_found','not_checked','unknown']</text>
  <text x="80" y="560" font-size="12" fill="#0f172a">soundsLikeMissingness() ↔ usesSafeMissingness()</text>
  <text x="80" y="578" font-size="12" fill="#0f172a">every citation_id must exist in sourceMap</text>

  <!-- 4 Patient & Source Integrity -->
  <rect x="720" y="410" width="620" height="200" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="740" y="438" font-size="15" font-weight="bold" fill="#0f172a">4. Patient &amp; Source Integrity</text>
  <text x="740" y="462" font-size="12" fill="#0f172a">source.patient_id == accessToken.PatientContext.pid</text>
  <text x="740" y="480" font-size="11" fill="#334155">→ else 'cites a source outside the current patient context.'</text>
  <text x="740" y="502" font-size="12" fill="#0f172a">verifyActiveStatusClaim(): \bactive\b on medication|allergy|problem|result|event</text>
  <text x="740" y="520" font-size="11" fill="#334155">→ cited source.status must be 'active'</text>
  <text x="740" y="542" font-size="12" fill="#0f172a">claimTextSupportedBySources(): significantTokens(claim) ∩ tokens(display+excerpt) ≠ ∅</text>
  <text x="740" y="560" font-size="11" fill="#334155">→ stopWords filter active/checked/daily/tablet/status/…</text>
  <text x="740" y="582" font-size="12" fill="#0f172a">certainty == 'conflicting' → warning (not error)</text>

  <!-- 5 Missingness & Tool Failures -->
  <rect x="60" y="630" width="1280" height="180" rx="10" ry="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="80" y="658" font-size="15" font-weight="bold" fill="#0f172a">5. Missingness &amp; Tool Failures</text>
  <text x="80" y="682" font-size="12" fill="#0f172a">verifyMissingOrUncertain(): text + advice + missingness phrasing + citation lookup</text>
  <text x="80" y="702" font-size="12" fill="#0f172a">isCompletenessStatement(): /no (additional|other|more) … (found|identified|listed|seen|present)/</text>
  <text x="80" y="720" font-size="11" fill="#334155">→ completeness statements forbidden in missing_or_uncertain</text>
  <text x="80" y="744" font-size="12" fill="#0f172a">verifyToolFailures(): packet.tool_runs[].error_class present →</text>
  <text x="80" y="762" font-size="11" fill="#334155">json_encode(answer) must contain 'unavailable' OR 'not checked' OR 'tool'</text>
  <text x="80" y="788" font-size="12" fill="#0f172a">Result: new AgentVerificationResult($errors === [], unique $errors, unique $warnings)</text>

  <!-- Edges -->
  <line x1="700" y1="235" x2="700" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="390" x2="370" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="404" font-size="11" fill="#0f172a">for each claim</text>

  <line x1="680" y1="510" x2="720" y2="510" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="502" font-size="11" fill="#0f172a">claim has citations</text>

  <line x1="1030" y1="610" x2="1030" y2="630" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- L1 → L5 (tool_runs feed) curved on the left -->
  <path d="M 60 172 C 30 172 30 720 60 720" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <text x="35" y="450" font-size="11" fill="#7c3aed" transform="rotate(-90 35 450)">tool_runs[]</text>
</svg>
