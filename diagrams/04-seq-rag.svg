  <rect x="60.0" y="940.0" width="1380.0" height="120.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.0" stroke-dasharray="none"/>
  <text x="68.0" y="977.2" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">Why hybrid + rerank?</text>
  <text x="68.0" y="994.6" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• BM25 alone: misses paraphrase ('hyperlipidemia' vs 'high cholesterol').</text>
  <text x="68.0" y="1012.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• Dense alone: misses rare clinical tokens (LOINC codes, drug names) and is sensitive to query phrasing.</text>
  <text x="68.0" y="1029.4" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• RRF fuses both robustly without tuning weights; rerank promotes the chunks that actually answer the query.</text>
