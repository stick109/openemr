<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="740" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">
    Agent Verification — AgentAnswerVerifier::verify()
  </text>
  <text x="740" y="84" text-anchor="middle" font-size="16" fill="#475569">
    Five layers — inputs &amp; source map, schema checks, per-claim rules, patient/source integrity, missingness &amp; tool-failure disclosure.
  </text>

  <!-- 1 Inputs & Source Map -->
  <rect x="60" y="120" width="1360" height="160" rx="10" ry="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="156" font-size="20" font-weight="bold" fill="#0f172a">1. Inputs &amp; Source Map</text>
  <text x="80" y="186" font-size="15" fill="#0f172a">verify(array $answer, AgentAccessToken $accessToken, array $packet)</text>
  <text x="80" y="210" font-size="15" fill="#0f172a">sourceMap() ← $packet['sources'] indexed by source_id</text>
  <text x="80" y="234" font-size="15" fill="#0f172a">$packet['tool_runs'] held aside for verifyToolFailures()</text>
  <text x="80" y="258" font-size="15" fill="#0f172a">$accessToken-&gt;getPatientContext()-&gt;getPid() — single allowed patient ID. Accumulators: $errors, $warnings, $totalText</text>

  <!-- 2 Schema -->
  <rect x="60" y="300" width="1360" height="170" rx="10" ry="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="336" font-size="20" font-weight="bold" fill="#0f172a">2. Schema &amp; Shape Checks</text>
  <text x="80" y="366" font-size="15" fill="#0f172a">answer_blocks must be a list (array_is_list)</text>
  <text x="80" y="390" font-size="15" fill="#0f172a">each block must be an object; heading required</text>
  <text x="80" y="414" font-size="15" fill="#0f172a">each block.claims must be a list</text>
  <text x="80" y="438" font-size="15" fill="#0f172a">missing_or_uncertain must be a list</text>
  <text x="80" y="462" font-size="14" fill="#334155">strlen($totalText) ≤ MAX_TOTAL_TEXT_LENGTH (4000) — 90-second workflow cap</text>

  <!-- 3 verifyClaim -->
  <rect x="60" y="490" width="660" height="260" rx="10" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="526" font-size="20" font-weight="bold" fill="#0f172a">3. verifyClaim() per claim</text>
  <text x="80" y="556" font-size="15" fill="#0f172a">text required</text>
  <text x="80" y="580" font-size="15" fill="#0f172a">containsOutOfScopeAdvice():</text>
  <text x="80" y="602" font-size="13" fill="#334155">/should|recommend|consider|start|stop|prescribe|diagnose|treat|order/</text>
  <text x="80" y="628" font-size="15" fill="#0f172a">empty citation_ids → certainty must be in</text>
  <text x="80" y="650" font-size="15" fill="#0f172a">  UNCITED_CERTAINTIES ['not_found','not_checked','unknown']</text>
  <text x="80" y="678" font-size="15" fill="#0f172a">soundsLikeMissingness() ↔ usesSafeMissingness()</text>
  <text x="80" y="702" font-size="15" fill="#0f172a">every citation_id must exist in sourceMap</text>

  <!-- 4 Patient & Source Integrity -->
  <rect x="760" y="490" width="660" height="260" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="526" font-size="20" font-weight="bold" fill="#0f172a">4. Patient &amp; Source Integrity</text>
  <text x="780" y="556" font-size="15" fill="#0f172a">source.patient_id == accessToken.PatientContext.pid</text>
  <text x="780" y="578" font-size="13" fill="#334155">→ else 'cites a source outside the current patient context.'</text>
  <text x="780" y="604" font-size="15" fill="#0f172a">verifyActiveStatusClaim(): \bactive\b on</text>
  <text x="780" y="626" font-size="15" fill="#0f172a">  medication|allergy|problem|result|event</text>
  <text x="780" y="648" font-size="13" fill="#334155">→ cited source.status must be 'active'</text>
  <text x="780" y="674" font-size="15" fill="#0f172a">claimTextSupportedBySources(): significantTokens overlap</text>
  <text x="780" y="696" font-size="13" fill="#334155">→ stopWords filter active/checked/daily/tablet/status/…</text>
  <text x="780" y="722" font-size="15" fill="#0f172a">certainty == 'conflicting' → warning (not error)</text>

  <!-- 5 Missingness & Tool Failures -->
  <rect x="60" y="770" width="1360" height="220" rx="10" ry="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="80" y="806" font-size="20" font-weight="bold" fill="#0f172a">5. Missingness &amp; Tool Failures</text>
  <text x="80" y="836" font-size="15" fill="#0f172a">verifyMissingOrUncertain(): text + advice + missingness phrasing + citation lookup</text>
  <text x="80" y="860" font-size="15" fill="#0f172a">isCompletenessStatement(): /no (additional|other|more) … (found|identified|listed|seen|present)/</text>
  <text x="80" y="882" font-size="14" fill="#334155">→ completeness statements forbidden in missing_or_uncertain</text>
  <text x="80" y="908" font-size="15" fill="#0f172a">verifyToolFailures(): packet.tool_runs[].error_class present →</text>
  <text x="80" y="930" font-size="14" fill="#334155">json_encode(answer) must contain 'unavailable' OR 'not checked' OR 'tool'</text>
  <text x="80" y="958" font-size="15" fill="#0f172a">Result: new AgentVerificationResult($errors === [], unique $errors, unique $warnings)</text>

  <!-- Edges -->
  <line x1="740" y1="280" x2="740" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="470" x2="390" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="400" y="485" font-size="14" fill="#0f172a">for each claim</text>

  <line x1="720" y1="610" x2="760" y2="610" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="725" y="600" font-size="14" fill="#0f172a">claim has citations</text>

  <line x1="1090" y1="750" x2="1090" y2="770" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- L1 → L5 (tool_runs feed) curved on the left -->
  <path d="M 60 200 C 25 200 25 880 60 880" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <text x="40" y="540" font-size="14" fill="#7c3aed" transform="rotate(-90 40 540)">tool_runs[]</text>
</svg>
