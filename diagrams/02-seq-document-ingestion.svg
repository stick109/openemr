  <text x="1400.0" y="123.3" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">OpenEMR DB / FHIR</text>
  <text x="740.0" y="44.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Document Ingestion Sequence — upload PDF → extracted JSON → FHIR/SQL writes</text>
  <line x1="160.0" y1="200.0" x2="370.0" y2="200.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <text x="265.0" y="193.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">1. Upload PDF + select doc_type</text>
  <line x1="370.0" y1="240.0" x2="590.0" y2="240.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <text x="480.0" y="233.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">2. CSRF + ACL + PDF magic + size cap</text>
  <line x1="590.0" y1="290.0" x2="590.0" y2="290.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <text x="590.0" y="283.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">3. Copy file → /var/uploads (mounted in agent container)</text>
  <line x1="590.0" y1="330.0" x2="810.0" y2="330.0" stroke="#0f766e" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#at)"/>
  <text x="700.0" y="323.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f766e">4. POST /api/agent/run {patient_id, file_path, doc_type, encounter_id, trace_id}</text>
  <line x1="810.0" y1="380.0" x2="1030.0" y2="380.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <text x="920.0" y="373.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">5. Run LangGraph: state = {file, doc_type}</text>
  <line x1="1030.0" y1="420.0" x2="1030.0" y2="420.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <text x="1030.0" y="413.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">6. Supervisor decides: extract</text>
  <line x1="1030.0" y1="470.0" x2="1240.0" y2="470.0" stroke="#9f1239" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ar)"/>
  <text x="1135.0" y="463.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9f1239">7. Files API upload + Structured Outputs call</text>
  <line x1="1240.0" y1="510.0" x2="1030.0" y2="510.0" stroke="#9f1239" stroke-width="2.0" stroke-dasharray="8,4" />
  <text x="1135.0" y="503.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9f1239">8. JSON-validated extraction with bbox per field</text>
  <line x1="810.0" y1="560.0" x2="1030.0" y2="560.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <text x="920.0" y="553.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">9. Supervisor decides: retrieve (if guideline question)</text>
  <line x1="1030.0" y1="610.0" x2="1030.0" y2="610.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <text x="1030.0" y="603.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">10. Hybrid retrieve + Cohere rerank → top-5 chunks (with citations)</text>
  <line x1="1030.0" y1="660.0" x2="1030.0" y2="660.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ad)"/>
  <text x="1030.0" y="653.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">11. Supervisor finalize: build {extracted, evidence, citations, cost, latency}</text>
  <line x1="810.0" y1="710.0" x2="590.0" y2="710.0" stroke="#0f766e" stroke-width="2.0" stroke-dasharray="8,4" />
  <text x="700.0" y="703.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f766e">12. Return ExtractionResult JSON</text>
  <line x1="590.0" y1="770.0" x2="1400.0" y2="770.0" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ao)"/>
  <text x="995.0" y="763.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2410c">13a. doc_type=lab_pdf → procedure_order/report/result rows + Observation FHIR</text>
  <line x1="590.0" y1="820.0" x2="1400.0" y2="820.0" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ao)"/>
  <text x="995.0" y="813.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2410c">13b. doc_type=intake_form → patient_data merge / questionnaire_response / documents</text>
  <line x1="590.0" y1="870.0" x2="1400.0" y2="870.0" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ao)"/>
  <text x="995.0" y="863.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2410c">14. INSERT form_upload_intake_form_citation rows (one per persisted field)</text>
  <line x1="590.0" y1="920.0" x2="1400.0" y2="920.0" stroke="#c2410c" stroke-width="2.0" stroke-dasharray="none" marker-end="url(#ao)"/>
  <text x="995.0" y="913.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2410c">15. INSERT form_upload_intake_form (timeline row, links to encounter)</text>
  <line x1="590.0" y1="970.0" x2="370.0" y2="970.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="8,4" />
  <text x="480.0" y="963.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">16. FormService::addForm() — appears in encounter timeline</text>
  <line x1="370.0" y1="1020.0" x2="160.0" y2="1020.0" stroke="#0f172a" stroke-width="2.0" stroke-dasharray="8,4" />
  <text x="265.0" y="1013.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0f172a">17. Render success page + click-to-source preview</text>
</svg>