<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <text x="700" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">
    Explanation Of Changes — Last Five Days (2026-04-27 to 2026-05-01)
  </text>
  <text x="700" y="74" text-anchor="middle" font-size="13" fill="#475569">
    Five layers grouping every local commit. Layer 1 sets the constraints, Layers 2–4 are the running system, Layer 5 hosts and feeds it.
  </text>

  <!-- Layer 1 -->
  <rect x="60" y="120" width="1280" height="120" rx="10" ry="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="148" font-size="15" font-weight="bold" fill="#0f172a">Layer 1 — Architecture &amp; Planning Docs</text>
  <text x="80" y="178" font-size="12" fill="#0f172a">ARCHITECTURE.md, PLAN-OF-ACTIONS.md, AUDIT.md, USERS.md, CURRENT-ARCHITECTURE.md, pre-search.md, diagrams/*</text>
  <text x="80" y="208" font-size="12" fill="#334155">Defines the closed-intent MVP, security gates, verification contract, and the phased plan.</text>

  <!-- Layer 2 -->
  <rect x="60" y="280" width="400" height="220" rx="10" ry="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="308" font-size="15" font-weight="bold" fill="#0f172a">Layer 2 — Patient Chart Co-Pilot UI</text>
  <text x="80" y="334" font-size="12" fill="#0f172a">interface/patient_file/summary/agent.php</text>
  <text x="80" y="354" font-size="12" fill="#0f172a">templates/patient/agent_panel.html.twig</text>
  <text x="80" y="374" font-size="12" fill="#0f172a">interface/patient_file/summary/agent_panel.js</text>
  <text x="80" y="394" font-size="12" fill="#0f172a">standard.json (chart tab menu)</text>
  <text x="80" y="414" font-size="12" fill="#0f172a">Isolated UI tests</text>
  <text x="80" y="448" font-size="12" fill="#334155">Closed-intent buttons, prompt-preview field,</text>
  <text x="80" y="468" font-size="12" fill="#334155">disabled send. No free text leaves the browser.</text>

  <!-- Layer 3 -->
  <rect x="500" y="280" width="400" height="220" rx="10" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="308" font-size="15" font-weight="bold" fill="#0f172a">Layer 3 — Agent API &amp; Orchestration</text>
  <text x="520" y="332" font-size="12" fill="#0f172a">AgentIntentRestController, AgentIntentCatalog</text>
  <text x="520" y="350" font-size="12" fill="#0f172a">AgentLlmOrchestrator, AgentLlmConfig</text>
  <text x="520" y="368" font-size="12" fill="#0f172a">AgentLlmRequest / AgentLlmResponse</text>
  <text x="520" y="386" font-size="12" fill="#0f172a">AgentLlmProviderInterface (+ OpenAI / Disabled)</text>
  <text x="520" y="404" font-size="12" fill="#0f172a">AgentAnswerSchema</text>
  <text x="520" y="422" font-size="12" fill="#0f172a">AgentAnswerVerifier, AgentVerificationResult</text>
  <text x="520" y="440" font-size="12" fill="#0f172a">ApiResponseLoggerListener</text>
  <text x="520" y="476" font-size="12" fill="#334155">POST /api/agent/intent → orchestrate → verify.</text>

  <!-- Layer 4 -->
  <rect x="940" y="280" width="400" height="220" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="960" y="308" font-size="15" font-weight="bold" fill="#0f172a">Layer 4 — Security, Evidence &amp; PHI</text>
  <text x="960" y="332" font-size="12" fill="#0f172a">AgentAccessBroker, AccessDecision, AccessToken</text>
  <text x="960" y="350" font-size="12" fill="#0f172a">AgentCurrentPatientResolver, PatientContext</text>
  <text x="960" y="368" font-size="12" fill="#0f172a">Evidence/AgentEvidenceToolset, EvidenceCaps</text>
  <text x="960" y="386" font-size="12" fill="#0f172a">EvidencePacketNormalizer</text>
  <text x="960" y="404" font-size="12" fill="#0f172a">EvidenceRecordRepositoryInterface</text>
  <text x="960" y="422" font-size="12" fill="#0f172a">SqlEvidenceRecordRepository</text>
  <text x="960" y="440" font-size="12" fill="#0f172a">AgentEvidenceResponseBuilder, Anonymizer</text>
  <text x="960" y="476" font-size="12" fill="#334155">Patient binding, capped reads, PHI scrubbed in logs.</text>

  <!-- DB -->
  <ellipse cx="1140" cy="552" rx="120" ry="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <path d="M 1020 552 V 628 A 120 14 0 0 0 1260 628 V 552" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <ellipse cx="1140" cy="628" rx="120" ry="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1140" y="600" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">MySQL / MariaDB</text>
  <text x="1140" y="620" text-anchor="middle" font-size="11" fill="#334155">patient · encounter · list · drug · allergy · event</text>

  <!-- Layer 5 -->
  <rect x="60" y="690" width="1280" height="170" rx="10" ry="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="80" y="718" font-size="15" font-weight="bold" fill="#0f172a">Layer 5 — Dev, Demo Data &amp; Deployment</text>
  <text x="80" y="744" font-size="12" fill="#0f172a">build-docker.ps1, run-docker.ps1, deploy-railway.ps1, Dockerfile.railway, railway.toml, .dockerignore, .railwayignore</text>
  <text x="80" y="764" font-size="12" fill="#0f172a">generate-test-data.ps1 / .md, sql/demo_current_medications.sql, sql/demo_current_allergies.sql, sql/demo_recent_events.sql</text>
  <text x="80" y="784" font-size="12" fill="#0f172a">show-agent-audit-logs.ps1, show-agent-diagnostic-logs.ps1, environment-notes.md, .env.example</text>
  <text x="80" y="822" font-size="12" fill="#334155">Local Docker, Railway image and deploy, demo seed data, log inspection scripts, environment notes.</text>

  <!-- Edges from Layer 1 (downward, dashed blue) -->
  <line x1="260" y1="240" x2="260" y2="280" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <line x1="700" y1="240" x2="700" y2="280" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <line x1="1140" y1="240" x2="1140" y2="280" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <text x="270" y="270" font-size="11" fill="#0284c7">constrains</text>
  <text x="710" y="270" font-size="11" fill="#0284c7">constrains</text>
  <text x="1150" y="270" font-size="11" fill="#0284c7">constrains</text>

  <!-- Edges between running layers (solid grey) -->
  <line x1="460" y1="390" x2="500" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="382" font-size="11" fill="#0f172a">POST /api/agent/intent</text>

  <line x1="900" y1="390" x2="940" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="382" font-size="11" fill="#0f172a">authorize · read</text>

  <line x1="1140" y1="500" x2="1140" y2="538" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1150" y="524" font-size="11" fill="#0f172a">bounded SQL reads</text>

  <!-- Edges from Layer 5 upward (dashed red) -->
  <line x1="260" y1="690" x2="260" y2="500" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="270" y="610" font-size="11" fill="#e11d48">hosts</text>

  <line x1="700" y1="690" x2="700" y2="500" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="710" y="610" font-size="11" fill="#e11d48">hosts &amp; observes</text>

  <line x1="1140" y1="690" x2="1140" y2="642" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="1150" y="676" font-size="11" fill="#e11d48">seeds demo data</text>
</svg>
