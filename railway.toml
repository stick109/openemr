[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
# Watch patterns are intentionally omitted so any uploaded source change
# triggers a Railway build.

[deploy]
healthcheckPath = "/meta/health/readyz"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Note: the dashboard OAuth-client ensure script (encrypts the
# DASHBOARD_OIDC_CLIENT_SECRET with this site's CryptoGen drive-side key
# and UPSERTs the oauth_clients row) is wired into the runtime entrypoint
# via Dockerfile.railway's sed-patch on openemr.sh, NOT a preDeployCommand.
# Railway's preDeploy environment is an ephemeral container without the
# persistent sites/ volume, so CryptoGen there derives a different
# drive-side key than the running container, and any row it writes fails
# HMAC validation at /token time ("invalid_client").
