##
# OpenEMR Sidecar -- Clinical Co-Pilot Migration gate (M23).
#
# This workflow gates the PHP -> Python sidecar migration on every PR
# and on every push to master / codex/** branches.  It complements the
# Week 2 50-case eval gate in ``agent-eval.yml`` (kept as-is) with a
# fast feedback loop covering:
#
#   * Python unit tests (full agent-service suite, fail-fast)
#   * Sidecar wire-contract + auth + parity tests (focused subset)
#   * PHP isolated tests filtered to the migration namespaces
#   * Tool-behavior eval (M22 ``--suite copilot-tools``)
#   * Migration regression meta-test (asserts CI catches a disallowed
#     tool, a missing citation, and a skipped required tool)
#
# Failure of any job blocks the PR.  ``OPENAI_API_KEY`` is forced empty
# so the FakeLLMClient guard activates and CI never reaches the live
# OpenAI API.

name: Copilot Migration Gate

on:
  push:
    branches:
    - master
    - 'codex/**'
  pull_request:
    branches:
    - master
    - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-unit-tests:
    name: Python unit tests (agent-service)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: agent-service/pyproject.toml

    - name: Install agent-service (with dev extras)
      working-directory: agent-service
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run full agent-service test suite (fail-fast)
      working-directory: agent-service
      env:
        OPENAI_API_KEY: ''
      run: |
        python -m pytest -x

  sidecar-contract-parity:
    name: Sidecar contract + auth + parity tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: agent-service/pyproject.toml

    - name: Install agent-service (with dev extras)
      working-directory: agent-service
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run contract + auth + parity tests
      working-directory: agent-service
      env:
        OPENAI_API_KEY: ''
      run: |
        python -m pytest -v \
          tests/test_copilot_run_contract.py \
          tests/test_copilot_run_context.py \
          tests/test_copilot_auth.py \
          tests/test_intent_catalog.py \
          tests/test_evidence_models.py

  php-isolated-agent-tests:
    name: PHP isolated tests (Agent / Copilot / Sidecar)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup PHP and Composer
      uses: ./.github/actions/setup-php-composer
      with:
        php-version: '8.2'

    - name: Run isolated PHP tests filtered to migration namespaces
      run: |
        vendor/bin/phpunit -c phpunit-isolated.xml \
          --filter '(Agent|Copilot|Sidecar)' \
          --log-junit=junit-migration.xml

    - name: Upload JUnit results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: junit-copilot-migration-php
        path: junit-migration.xml

  copilot-tools-eval:
    name: Copilot-tools eval (M22 suite)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: agent-service/pyproject.toml

    - name: Install agent-service (with dev extras)
      working-directory: agent-service
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run copilot-tools eval suite
      working-directory: agent-service
      env:
        # Force the FakeLLMClient guard.  The suite drives a deterministic
        # FakeLLMToolChoiceClient and never reaches the live OpenAI API.
        OPENAI_API_KEY: ''
      run: |
        python -m agent_service.eval --suite copilot-tools

  migration-regression-injection:
    name: Migration regression-injection meta-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: agent-service/pyproject.toml

    - name: Install agent-service (with dev extras)
      working-directory: agent-service
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run migration CI regression meta-test
      working-directory: agent-service
      env:
        OPENAI_API_KEY: ''
      run: |
        python -m pytest -v tests/test_migration_ci_regressions.py
