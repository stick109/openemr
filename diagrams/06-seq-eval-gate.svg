  <text x="88.0" y="814.6" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">Triggers on pull_request. Pulls fixtures + baseline, runs the same rubric runner.</text>
  <text x="88.0" y="832.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">Posts a check (success/failure) to the PR. Branch protection requires this check to be green before merge.</text>
  <text x="88.0" y="849.4" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">Net effect: even pushes from a clone that skipped the local hook are still gated.</text>
